<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>切片免疫室點貨系統</title>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<style>
:root{
  --primary:#1e40af; --primary-light:#dbeafe; --bg-color:#f1f5f9;
  --danger:#dc2626; --danger-bg:#fef2f2; --danger-border:#fca5a5;
  --success:#15803d; --success-bg:#f0fdf4; --success-border:#86efac;
  --warn-bg:#fffbeb; --warn-border:#fcd34d; --warn-text:#92400e;
  --gray-50:#f8fafc; --gray-100:#f1f5f9; --gray-200:#e2e8f0; --gray-400:#94a3b8; --gray-600:#475569; --gray-800:#1e293b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{margin:0;padding:0 0 110px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans TC","Microsoft JhengHei",sans-serif;background:var(--bg-color);color:var(--gray-800);}

.top-bar{position:sticky;top:0;z-index:100;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.08);}
.header-title{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 16px 10px;background:var(--primary);color:#fff;}
.header-title h1{margin:0;font-size:16px;font-weight:700;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;}
.header-actions{display:flex;gap:5px;flex-shrink:0;}
.btn-sm{border:none;border-radius:6px;padding:6px 10px;font-size:12px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:4px;white-space:nowrap;}
.btn-add{background:#fff;color:var(--primary);}
.btn-ghost{background:rgba(255,255,255,.18);color:#fff;}

.sheet-tabs{display:flex;overflow-x:auto;border-bottom:1px solid var(--gray-200);background:#fff;scrollbar-width:none;}
.sheet-tabs::-webkit-scrollbar{display:none;}
.sheet-tab{flex:1 0 auto;text-align:center;padding:9px 12px 7px;font-size:14px;font-weight:600;color:var(--gray-600);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;}
.sheet-tab .prog{display:block;font-size:10.5px;font-weight:500;color:var(--gray-400);margin-top:1px;}
.sheet-tab.active{color:var(--primary);border-bottom-color:var(--primary);background:#f8faff;}
.sheet-tab.active .prog{color:var(--primary);}

.filter-area{padding:8px 12px;background:#fff;border-bottom:1px solid var(--gray-200);}
.search-row{display:flex;gap:8px;margin-bottom:8px;}
.search-input{flex:1;min-width:0;height:38px;padding:0 12px;border:1.5px solid var(--gray-200);border-radius:8px;font-size:15px;outline:none;}
.search-input:focus{border-color:var(--primary);}
.toggle-btn{height:38px;padding:0 10px;border-radius:8px;border:1.5px solid var(--gray-200);background:#fff;color:var(--gray-600);font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;}
.toggle-btn.order-t{border-color:var(--danger-border);color:var(--danger);}
.toggle-btn.order-t.active{background:var(--danger);color:#fff;border-color:var(--danger);}
.toggle-btn.todo-t.active{background:var(--gray-800);color:#fff;border-color:var(--gray-800);}
.cat-pills{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;}
.cat-pills::-webkit-scrollbar{display:none;}
.cat-pill{padding:5px 11px;border-radius:16px;background:var(--gray-100);color:var(--gray-600);font-size:12px;font-weight:600;white-space:nowrap;cursor:pointer;border:1px solid transparent;}
.cat-pill.active{background:var(--primary-light);color:var(--primary);border-color:var(--primary);}

.list-container{padding:10px 12px;max-width:720px;margin:0 auto;}
.section-divider{font-size:13px;font-weight:700;color:var(--gray-600);margin:16px 4px 8px;}
.section-note{background:var(--warn-bg);border:1.5px solid var(--warn-border);color:var(--warn-text);border-radius:10px;padding:9px 12px;font-size:13px;font-weight:600;margin:0 0 10px;line-height:1.45;}

.item-card{background:#fff;border-radius:12px;padding:12px 14px;margin-bottom:10px;border:1.5px solid var(--gray-200);border-left-width:6px;box-shadow:0 1px 3px rgba(0,0,0,.04);}
.item-card.need-order{background:var(--danger-bg);border-color:var(--danger-border);border-left-color:var(--danger);}
.item-card.ok-stock{background:var(--success-bg);border-color:var(--success-border);border-left-color:var(--success);}
.item-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:10px;}
.item-title-wrap{flex:1;min-width:0;}
.item-name{font-size:16px;font-weight:700;line-height:1.35;word-break:break-word;}
.item-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:4px;font-size:12px;color:var(--gray-600);}
.badge{padding:2px 7px;border-radius:6px;font-size:11px;font-weight:700;background:var(--gray-200);color:var(--gray-600);}
.badge.b-Roche{background:#fef9c3;color:#854d0e;}
.badge.b-Leica{background:#fce7f3;color:#9d174d;}
.badge.b-龐德{background:#ffedd5;color:#9a3412;}
.badge.b-Dako{background:#dcfce7;color:#166534;}
.badge.b-子修{background:#e0e7ff;color:#3730a3;}
.badge.b-耗材{background:#e2e8f0;color:#334155;}
.note{font-size:12px;color:var(--warn-text);background:var(--warn-bg);padding:1px 7px;border-radius:6px;}
.icon-btn{background:transparent;border:1px solid var(--gray-200);border-radius:6px;padding:4px 8px;font-size:12px;color:var(--gray-600);cursor:pointer;flex-shrink:0;}

.item-controls{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
.stepper{display:flex;align-items:center;background:#fff;border:1.5px solid var(--gray-200);border-radius:10px;overflow:hidden;}
.step-btn{width:44px;height:42px;border:none;background:var(--gray-50);font-size:20px;font-weight:700;color:var(--gray-800);cursor:pointer;}
.step-btn:active{background:var(--gray-200);}
.qty-input{width:60px;height:42px;border:none;border-left:1px solid var(--gray-200);border-right:1px solid var(--gray-200);text-align:center;font-size:18px;font-weight:700;color:var(--gray-800);outline:none;background:#fff;}
.qty-input::placeholder{color:var(--gray-400);font-size:13px;font-weight:500;}
.check-group{display:flex;gap:6px;}
.check-btn{height:42px;padding:0 14px;border-radius:10px;border:1.5px solid var(--gray-200);background:#fff;font-size:14px;font-weight:700;color:var(--gray-600);cursor:pointer;}
.check-btn.ok.on{background:var(--success);border-color:var(--success);color:#fff;}
.check-btn.order.on{background:var(--danger);border-color:var(--danger);color:#fff;}
.status-box{flex:1;text-align:right;min-width:110px;}
.status-tag{display:inline-block;padding:6px 10px;border-radius:8px;font-size:13px;font-weight:700;}
.status-tag.pending{background:var(--gray-100);color:var(--gray-400);}
.status-tag.order{background:var(--danger);color:#fff;}
.status-tag.ok{background:var(--success);color:#fff;}
.order-row{display:flex;align-items:center;justify-content:flex-end;gap:6px;margin-top:6px;font-size:12px;font-weight:700;color:var(--danger);}
.mini-step{display:flex;align-items:center;border:1.5px solid var(--danger-border);border-radius:8px;overflow:hidden;background:#fff;}
.mini-step button{width:30px;height:30px;border:none;background:#fff;font-size:16px;font-weight:700;color:var(--danger);cursor:pointer;}
.mini-step span{min-width:30px;text-align:center;font-size:15px;color:var(--gray-800);}

.bottom-bar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--gray-200);padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 -2px 10px rgba(0,0,0,.08);z-index:100;}
.summary-info{font-size:13px;line-height:1.35;}
.summary-count{font-size:17px;font-weight:800;color:var(--danger);}
.btn-export{background:var(--primary);color:#fff;border:none;border-radius:10px;padding:12px 18px;font-size:15px;font-weight:700;cursor:pointer;}

.modal-backdrop{display:none;position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:200;align-items:center;justify-content:center;padding:16px;}
.modal-backdrop.show{display:flex;}
.modal-box{background:#fff;border-radius:14px;width:100%;max-width:460px;padding:18px;max-height:90vh;overflow-y:auto;}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.modal-header h2{margin:0;font-size:17px;}
.form-group{margin-bottom:12px;}
.form-group label{display:block;font-size:13px;font-weight:600;margin-bottom:4px;color:var(--gray-600);}
.form-hint{font-size:11.5px;color:var(--gray-400);margin-top:3px;}
.form-control{width:100%;height:40px;padding:0 10px;border:1.5px solid var(--gray-200);border-radius:8px;font-size:15px;background:#fff;}
.export-textarea{width:100%;height:260px;padding:10px;border:1.5px solid var(--gray-200);border-radius:8px;font-size:14px;line-height:1.55;font-family:inherit;resize:vertical;}
.modal-footer{display:flex;gap:8px;margin-top:14px;}
.btn-block{flex:1;height:44px;border-radius:8px;border:none;font-size:15px;font-weight:700;cursor:pointer;}
.btn-block:disabled{opacity:.5;cursor:not-allowed;}
.btn-secondary{background:var(--gray-200);color:var(--gray-800);}
.btn-primary{background:var(--primary);color:#fff;}
.btn-danger{background:var(--danger);color:#fff;}
.btn-success{background:var(--success);color:#fff;}

.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:rgba(15,23,42,.92);color:#fff;padding:9px 18px;border-radius:20px;font-size:13px;font-weight:600;z-index:300;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center;}
.toast.show{opacity:1;}
</style>
</head>
<body>

<div class="top-bar">
  <div class="header-title">
    <h1>📋 切片免疫室點貨系統</h1>
    <div class="header-actions">
      <button class="btn-sm btn-ghost" onclick="openThemeModal()" title="外觀">🎨</button>
      <button class="btn-sm btn-add" onclick="openItemModal()">＋ 新增</button>
      <button class="btn-sm btn-ghost" onclick="resetCounts()">清空</button>
    </div>
  </div>
  <div class="sheet-tabs" id="sheetTabs"></div>
  <div class="filter-area">
    <div class="search-row">
      <input type="text" id="searchInput" class="search-input" placeholder="🔍 搜尋抗體、耗材..." oninput="renderList()" />
      <button id="onlyTodoBtn" class="toggle-btn todo-t" onclick="toggleFilter('todo')">未點</button>
      <button id="onlyOrderBtn" class="toggle-btn order-t" onclick="toggleFilter('order')">需叫貨</button>
    </div>
    <div class="cat-pills" id="catPills"></div>
  </div>
</div>

<div class="list-container" id="listContainer"></div>

<div class="bottom-bar">
  <div class="summary-info">
    <div>已盤點 <strong id="countedNum">0</strong> / <span id="totalNum">0</span> 項</div>
    <div>需叫貨：<span class="summary-count" id="orderNum">0</span> 項</div>
  </div>
  <button class="btn-export" onclick="openExportModal()">📦 完成盤點</button>
</div>

<!-- 新增/編輯品項 -->
<div class="modal-backdrop" id="itemModal">
  <div class="modal-box">
    <div class="modal-header"><h2 id="itemModalTitle">新增品項</h2><button class="icon-btn" onclick="closeModal('itemModal')">✕</button></div>
    <input type="hidden" id="editItemId" />
    <div class="form-group"><label>廠牌</label><input id="editBrand" class="form-control" list="brandList" /><datalist id="brandList"></datalist></div>
    <div class="form-group"><label>分類</label><input id="editCat" class="form-control" list="catList" /><datalist id="catList"></datalist></div>
    <div class="form-group"><label>品項名稱</label><input id="editName" class="form-control" placeholder="例如：Ki67" /></div>
    <div class="form-group">
      <label>安全庫存量</label>
      <input type="number" id="editSafety" class="form-control" min="0" placeholder="留空 = 只需勾選確認" />
      <div class="form-hint">有填數字：盤點時輸入數量，低於此量自動列入叫貨。留空：盤點時只勾選「足夠／需叫貨」。</div>
    </div>
    <div class="form-group"><label>單位</label><input id="editUnit" class="form-control" placeholder="支 / 組 / 罐 / 盒 / 桶" /></div>
    <div class="form-group"><label>備註（選填）</label><input id="editNote" class="form-control" /></div>
    <div class="modal-footer">
      <button id="deleteItemBtn" class="btn-block btn-danger" onclick="deleteCurrentItem()">刪除</button>
      <button class="btn-block btn-secondary" onclick="closeModal('itemModal')">取消</button>
      <button class="btn-block btn-primary" onclick="saveItem()">儲存</button>
    </div>
  </div>
</div>

<!-- 完成盤點 / 叫貨清單 -->
<div class="modal-backdrop" id="exportModal">
  <div class="modal-box">
    <div class="modal-header"><h2>📦 叫貨清單</h2><button class="icon-btn" onclick="closeModal('exportModal')">✕</button></div>
    <div id="exportWarn" class="section-note" style="display:none;"></div>
    <div class="form-group"><label>盤點人</label><input id="counterName" class="form-control" placeholder="輸入姓名（寄信時會一併帶入）" /></div>
    <div class="form-group">
      <label>清單內容（可直接修改後再複製或寄出）</label>
      <textarea id="exportText" class="export-textarea"></textarea>
    </div>
    <div class="modal-footer">
      <button class="btn-block btn-secondary" onclick="copyExportText()">📋 複製</button>
      <button class="btn-block btn-primary" id="sendBtn" onclick="sendEmail()">✉️ 寄出 Email</button>
    </div>
  </div>
</div>

<!-- 外觀 -->
<div class="modal-backdrop" id="themeModal">
  <div class="modal-box">
    <div class="modal-header"><h2>🎨 外觀顏色設定</h2><button class="icon-btn" onclick="closeModal('themeModal')">✕</button></div>
    <div class="form-group">
      <label>快速套用</label>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px;">
        <button class="btn-sm" style="background:#1e40af;color:#fff;justify-content:center;padding:8px;" onclick="applyThemeColors('#1e40af','#f1f5f9')">經典深藍</button>
        <button class="btn-sm" style="background:#0f766e;color:#fff;justify-content:center;padding:8px;" onclick="applyThemeColors('#0f766e','#f0fdfa')">醫療青綠</button>
        <button class="btn-sm" style="background:#334155;color:#fff;justify-content:center;padding:8px;" onclick="applyThemeColors('#334155','#f8fafc')">極簡石墨</button>
        <button class="btn-sm" style="background:#7c3aed;color:#fff;justify-content:center;padding:8px;" onclick="applyThemeColors('#7c3aed','#f5f3ff')">紫羅蘭</button>
        <button class="btn-sm" style="background:#be185d;color:#fff;justify-content:center;padding:8px;" onclick="applyThemeColors('#be185d','#fdf2f8')">櫻粉</button>
        <button class="btn-sm" style="background:#b45309;color:#fff;justify-content:center;padding:8px;" onclick="applyThemeColors('#b45309','#fffbeb')">琥珀</button>
      </div>
    </div>
    <div class="form-group"><label>主色</label><input type="color" id="primaryColorPicker" value="#1e40af" style="width:54px;height:40px;border:none;cursor:pointer;" oninput="previewTheme()" /></div>
    <div class="form-group"><label>背景色</label><input type="color" id="bgColorPicker" value="#f1f5f9" style="width:54px;height:40px;border:none;cursor:pointer;" oninput="previewTheme()" /></div>
    <div class="modal-footer">
      <button class="btn-block btn-secondary" onclick="resetTheme()">恢復預設</button>
      <button class="btn-block btn-primary" onclick="saveTheme()">儲存</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
/* =====================================================================
   ✉️ EmailJS 設定（上傳 GitHub 前填好這 4 個值，詳見 README.md）
   ===================================================================== */

const DEF_KEY = 'ihc_inv_defs_v2';
const CNT_KEY = 'ihc_inv_counts_v2';
const THEME_KEY = 'ihc_inventory_theme_v1';
const NAME_KEY = 'ihc_inv_counter';

let items = [];
let counts = {};   // id -> {current, check:'ok'|'order', orderQty}

let currentCat = 'ALL';
let filterMode = null; // 'todo' | 'order' | null

function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }

function init(){
  let defs = null;
  try{ defs = JSON.parse(lsGet(DEF_KEY)); }catch(e){}
  items = (defs && defs.version === DATA_VERSION && Array.isArray(defs.items)) ? defs.items : JSON.parse(JSON.stringify(DEFAULT_ITEMS));
  try{ counts = JSON.parse(lsGet(CNT_KEY)) || {}; }catch(e){ counts = {}; }
  const nm = lsGet(NAME_KEY); if(nm) document.getElementById('counterName').value = nm;
  renderAll();
}
function saveDefs(){ lsSet(DEF_KEY, JSON.stringify({version:DATA_VERSION, items})); }
function saveCounts(){ lsSet(CNT_KEY, JSON.stringify(counts)); }

function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function showToast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2200); }
function closeModal(id){ document.getElementById(id).classList.remove('show'); }

/* ---------- 狀態判斷 ---------- */
const isCheckItem = it => it.safety === null || it.safety === undefined || it.safety === '';
function cOf(id){ return counts[id] || {}; }
function isCounted(it){
  const c = cOf(it.id);
  return isCheckItem(it) ? !!c.check : (c.current !== undefined && c.current !== null);
}
function isNeedOrder(it){
  const c = cOf(it.id);
  if(isCheckItem(it)) return c.check === 'order';
  return c.current !== undefined && c.current !== null && Number(c.current) < Number(it.safety);
}
function defaultOrderQty(it){
  if(isCheckItem(it)) return 1;
  return Math.max(1, Number(it.safety) - Number(cOf(it.id).current || 0));
}
function orderQty(it){
  const c = cOf(it.id);
  return (c.orderQty != null && c.orderQty > 0) ? c.orderQty : defaultOrderQty(it);
}

/* ---------- 篩選 ---------- */
function brandsInUse(){
  const set = new Set(items.map(i=>i.brand));
  return [...BRAND_ORDER.filter(b=>set.has(b)), ...[...set].filter(b=>!BRAND_ORDER.includes(b))];
}
function brandItems(){ return currentBrand==='ALL' ? items : items.filter(i=>i.brand===currentBrand); }

function toggleFilter(mode){
  filterMode = filterMode === mode ? null : mode;
  document.getElementById('onlyTodoBtn').classList.toggle('active', filterMode==='todo');
  document.getElementById('onlyOrderBtn').classList.toggle('active', filterMode==='order');
  renderList();
}
function switchBrand(b){ currentBrand=b; currentCat='ALL'; renderAll(); }
function selectCat(c){ currentCat=c; renderCatPills(); renderList(); }

/* ---------- Render ---------- */
function renderAll(){ renderTabs(); renderCatPills(); renderList(); }

function renderTabs(){
  const tabs = ['ALL', ...brandsInUse()];
  if(!tabs.includes(currentBrand)) currentBrand = 'ALL';
  document.getElementById('sheetTabs').innerHTML = tabs.map(b=>{
    const list = b==='ALL' ? items : items.filter(i=>i.brand===b);
    const done = list.filter(isCounted).length;
    return `<div class="sheet-tab ${currentBrand===b?'active':''}" onclick="switchBrand('${escapeHtml(b)}')">${b==='ALL'?'全部':escapeHtml(b)}<span class="prog">${done}/${list.length}</span></div>`;
  }).join('');
}

function renderCatPills(){
  const cats = ['ALL', ...new Set(brandItems().map(i=>i.cat))];
  if(!cats.includes(currentCat)) currentCat='ALL';
  document.getElementById('catPills').innerHTML = cats.map(c=>
    `<div class="cat-pill ${currentCat===c?'active':''}" onclick="selectCat('${escapeHtml(c).replace(/'/g,"\\'")}')">${c==='ALL'?'全部分類':escapeHtml(c)}</div>`
  ).join('');
}

function statusHtml(it){
  if(!isCounted(it)) return `<span class="status-tag pending">尚未點貨</span>`;
  if(!isNeedOrder(it)) return `<span class="status-tag ok">✓ 足夠</span>`;
  const q = orderQty(it);
  const sub = isCheckItem(it) ? '' : `<div style="font-size:11px;color:var(--danger);font-weight:600;margin-top:3px;">低於安全量 ${it.safety} ${escapeHtml(it.unit)}</div>`;
  return `<span class="status-tag order">⚠ 需叫貨</span>${sub}
    <div class="order-row">叫貨
      <div class="mini-step"><button onclick="stepOrder('${it.id}',-1)">−</button><span>${q}</span><button onclick="stepOrder('${it.id}',1)">＋</button></div>
      ${escapeHtml(it.unit)}</div>`;
}

function cardInner(it){
  const c = cOf(it.id);
  const counted = isCounted(it), need = isNeedOrder(it);
  let control;
  if(isCheckItem(it)){
    control = `<div class="check-group">
      <button class="check-btn ok ${c.check==='ok'?'on':''}" onclick="setCheck('${it.id}','ok')">✓ 足夠</button>
      <button class="check-btn order ${c.check==='order'?'on':''}" onclick="setCheck('${it.id}','order')">✗ 需叫貨</button>
    </div>`;
  } else {
    const v = (c.current===undefined||c.current===null) ? '' : c.current;
    control = `<div class="stepper">
      <button class="step-btn" onclick="stepQty('${it.id}',-1)">−</button>
      <input type="number" inputmode="numeric" min="0" class="qty-input" value="${v}" placeholder="數量"
        oninput="updateQty('${it.id}',this.value)" />
      <button class="step-btn" onclick="stepQty('${it.id}',1)">＋</button>
    </div>`;
  }
  const meta = isCheckItem(it)
    ? `<span>勾選確認</span>`
    : `<span>安全量 ${it.safety} ${escapeHtml(it.unit)}</span>`;
  return {
    cls: counted ? (need ? 'need-order' : 'ok-stock') : '',
    html: `<div class="item-top">
        <div class="item-title-wrap">
          <div class="item-name">${escapeHtml(it.name)}</div>
          <div class="item-meta">
            ${currentBrand==='ALL' ? `<span class="badge b-${escapeHtml(it.brand)}">${escapeHtml(it.brand)}</span>` : ''}
            ${meta}
            ${it.note ? `<span class="note">${escapeHtml(it.note)}</span>` : ''}
          </div>
        </div>
        <button class="icon-btn" onclick="openItemModal('${it.id}')">編輯</button>
      </div>
      <div class="item-controls">${control}<div class="status-box" id="st_${it.id}">${statusHtml(it)}</div></div>`
  };
}

function renderList(){
  const kw = document.getElementById('searchInput').value.trim().toLowerCase();
  const list = brandItems().filter(it=>{
    if(currentCat!=='ALL' && it.cat!==currentCat) return false;
    if(filterMode==='order' && !isNeedOrder(it)) return false;
    if(filterMode==='todo' && isCounted(it)) return false;
    if(kw && !`${it.name} ${it.cat} ${it.brand} ${it.note||''}`.toLowerCase().includes(kw)) return false;
    return true;
  });
  const box = document.getElementById('listContainer');
  if(!list.length){
    box.innerHTML = `<div style="text-align:center;padding:40px 16px;color:var(--gray-400);">${filterMode==='todo'?'🎉 這裡全部點完了':'沒有符合條件的品項'}</div>`;
  } else {
    let html='', last='';
    list.forEach(it=>{
      const key = `${it.brand}|${it.cat}`;
      if(key!==last){
        html += `<div class="section-divider">${currentBrand==='ALL'?escapeHtml(it.brand)+' · ':''}${escapeHtml(it.cat)}</div>`;
        if(SECTION_NOTES[key]) html += `<div class="section-note">${escapeHtml(SECTION_NOTES[key])}</div>`;
        last = key;
      }
      const c = cardInner(it);
      html += `<div class="item-card ${c.cls}" id="card_${it.id}">${c.html}</div>`;
    });
    box.innerHTML = html;
  }
  updateSummary();
}

function refreshCard(id){
  const it = items.find(x=>x.id===id); const el = document.getElementById('card_'+id);
  if(!it || !el) return;
  const c = cardInner(it);
  el.className = 'item-card ' + c.cls;
  // 數量輸入框保留焦點：只更新狀態區
  const st = document.getElementById('st_'+id);
  if(!isCheckItem(it) && st){ st.innerHTML = statusHtml(it); }
  else { el.innerHTML = c.html; }
  updateSummary(); renderTabs();
}

function updateSummary(){
  document.getElementById('totalNum').textContent = items.length;
  document.getElementById('countedNum').textContent = items.filter(isCounted).length;
  document.getElementById('orderNum').textContent = items.filter(isNeedOrder).length;
}

/* ---------- 盤點操作 ---------- */
function setCount(id, patch){ counts[id] = Object.assign({}, counts[id], patch); saveCounts(); }

function updateQty(id, val){
  if(val===''){ setCount(id,{current:null, orderQty:null}); }
  else { setCount(id,{current:Math.max(0, Math.floor(Number(val))||0), orderQty:null}); }
  refreshCard(id);
}
function stepQty(id, d){
  const c = cOf(id);
  let v = (c.current===undefined||c.current===null) ? (d>0?1:0) : Math.max(0, Number(c.current)+d);
  setCount(id,{current:v, orderQty:null});
  const inp = document.querySelector(`#card_${id} .qty-input`); if(inp) inp.value = v;
  refreshCard(id);
}
function setCheck(id, val){
  const c = cOf(id);
  setCount(id,{check: c.check===val ? null : val, orderQty:null});
  refreshCard(id);
}
function stepOrder(id, d){
  const it = items.find(x=>x.id===id);
  setCount(id,{orderQty: Math.max(1, orderQty(it)+d)});
  const st = document.getElementById('st_'+id); if(st) st.innerHTML = statusHtml(it);
}
function resetCounts(){
  if(!confirm('確定要清空這次所有的盤點紀錄嗎？')) return;
  counts = {}; saveCounts(); renderAll(); showToast('已清空盤點紀錄');
}

/* ---------- 新增 / 編輯 ---------- */
function fillDatalists(){
  document.getElementById('brandList').innerHTML = brandsInUse().map(b=>`<option value="${escapeHtml(b)}">`).join('');
  document.getElementById('catList').innerHTML = [...new Set(items.map(i=>i.cat))].map(c=>`<option value="${escapeHtml(c)}">`).join('');
}
function openItemModal(id){
  fillDatalists();
  const it = id ? items.find(x=>x.id===id) : null;
  document.getElementById('itemModalTitle').textContent = it ? '編輯品項' : '新增品項';
  document.getElementById('editItemId').value = it ? it.id : '';
  document.getElementById('editBrand').value = it ? it.brand : (currentBrand==='ALL'?'Roche':currentBrand);
  document.getElementById('editCat').value = it ? it.cat : (currentCat==='ALL'?'':currentCat);
  document.getElementById('editName').value = it ? it.name : '';
  document.getElementById('editSafety').value = it && !isCheckItem(it) ? it.safety : (it ? '' : 1);
  document.getElementById('editUnit').value = it ? it.unit : '支';
  document.getElementById('editNote').value = it && it.note ? it.note : '';
  document.getElementById('deleteItemBtn').style.display = it ? 'block' : 'none';
  document.getElementById('itemModal').classList.add('show');
}
function saveItem(){
  const id = document.getElementById('editItemId').value;
  const name = document.getElementById('editName').value.trim();
  if(!name){ alert('請輸入品項名稱'); return; }
  const sv = document.getElementById('editSafety').value.trim();
  const data = {
    brand: document.getElementById('editBrand').value.trim() || '未分類',
    cat: document.getElementById('editCat').value.trim() || '未分類',
    name,
    safety: sv==='' ? null : Math.max(0, Math.floor(Number(sv))||0),
    unit: document.getElementById('editUnit').value.trim() || '支',
    note: document.getElementById('editNote').value.trim() || undefined
  };
  if(id){
    const it = items.find(x=>x.id===id);
    const typeChanged = isCheckItem(it) !== (data.safety===null);
    Object.assign(it, data);
    if(typeChanged){ delete counts[id]; saveCounts(); }
    showToast('品項已更新');
  } else {
    const nid = 'c'+Date.now();
    // 插在同廠牌同分類的最後一筆後面
    let idx = -1; items.forEach((x,i)=>{ if(x.brand===data.brand && x.cat===data.cat) idx=i; });
    if(idx<0) items.forEach((x,i)=>{ if(x.brand===data.brand) idx=i; });
    items.splice(idx<0?items.length:idx+1, 0, Object.assign({id:nid}, data));
    showToast('已新增品項');
  }
  saveDefs(); closeModal('itemModal'); renderAll();
}
function deleteCurrentItem(){
  const id = document.getElementById('editItemId').value;
  if(!id || !confirm('確定要刪除此品項嗎？')) return;
  items = items.filter(x=>x.id!==id); delete counts[id];
  saveDefs(); saveCounts(); closeModal('itemModal'); renderAll(); showToast('已刪除品項');
}

/* ---------- 叫貨清單 ---------- */
function todayStr(){ const d=new Date(); return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`; }
function buildOrderText(){
  const need = items.filter(isNeedOrder);
  if(!need.length) return '本次盤點無需叫貨品項';
  const out = [];
  [...brandsInUse()].forEach(b=>{
    const g = need.filter(i=>i.brand===b);
    if(!g.length) return;
    out.push(`【${b}】`);
    g.forEach(i=>out.push(`${i.name}　${orderQty(i)}${i.unit}`));
    out.push('');
  });
  return out.join('\n').trim();
}
function openExportModal(){
  const left = items.length - items.filter(isCounted).length;
  const w = document.getElementById('exportWarn');
  if(left>0){ w.style.display='block'; w.textContent = `還有 ${left} 項尚未盤點，確定已經點完了嗎？（可關閉視窗後按「未點」篩選查看）`; }
  else w.style.display='none';
  document.getElementById('exportText').value = buildOrderText();
  const cfgOK = EMAIL_CONFIG.publicKey && EMAIL_CONFIG.serviceId && EMAIL_CONFIG.templateId && EMAIL_CONFIG.toEmail;
  const sb = document.getElementById('sendBtn');
  sb.title = cfgOK ? '' : '尚未設定 EmailJS';
  document.getElementById('exportModal').classList.add('show');
}
function copyExportText(){
  const ta = document.getElementById('exportText');
  const done = ()=>showToast('已複製叫貨清單');
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(ta.value).then(done).catch(()=>{ ta.select(); document.execCommand('copy'); done(); });
  } else { ta.select(); ta.setSelectionRange(0, 999999); document.execCommand('copy'); done(); }
}
async function sendEmail(){
  if(!(EMAIL_CONFIG.publicKey && EMAIL_CONFIG.serviceId && EMAIL_CONFIG.templateId && EMAIL_CONFIG.toEmail)){
    alert('尚未設定 EmailJS，請先在 HTML 最上方的 EMAIL_CONFIG 填入設定（詳見 README）。\n目前可先用「複製」。');
    return;
  }
  if(typeof emailjs === 'undefined'){ alert('Email 元件載入失敗，請確認網路連線後重新整理。'); return; }
  const who = document.getElementById('counterName').value.trim();
  if(!who){ alert('請先填寫盤點人'); document.getElementById('counterName').focus(); return; }
  lsSet(NAME_KEY, who);
  const btn = document.getElementById('sendBtn');
  btn.disabled = true; btn.textContent = '寄送中…';
  const date = todayStr();
  try{
    await emailjs.send(EMAIL_CONFIG.serviceId, EMAIL_CONFIG.templateId, {
      to_email: EMAIL_CONFIG.toEmail,
      subject: `切片免疫室叫貨清單 ${date}`,
      date, counter: who,
      order_count: items.filter(isNeedOrder).length,
      message: document.getElementById('exportText').value
    }, { publicKey: EMAIL_CONFIG.publicKey });
    closeModal('exportModal');
    showToast('✉️ 已寄出叫貨清單');
    setTimeout(()=>{ if(confirm('已寄出！要清空這次的盤點紀錄，準備下次盤點嗎？')){ counts={}; saveCounts(); renderAll(); } }, 300);
  }catch(err){
    alert('寄送失敗：' + (err && (err.text || err.message) || err) + '\n可先用「複製」貼到 LINE 或信件。');
  }finally{
    btn.disabled = false; btn.textContent = '✉️ 寄出 Email';
  }
}

/* ---------- 外觀 ---------- */
function hexTint(hex){ const c=hex.replace('#',''); const f=i=>Math.round(parseInt(c.substr(i,2),16)*0.14+255*0.86); return `rgb(${f(0)},${f(2)},${f(4)})`; }
function applyThemeColors(p,b){
  const r=document.documentElement.style; r.setProperty('--primary',p); r.setProperty('--primary-light',hexTint(p)); r.setProperty('--bg-color',b);
  document.getElementById('primaryColorPicker').value=p; document.getElementById('bgColorPicker').value=b;
}
function loadTheme(){ try{ const t=JSON.parse(lsGet(THEME_KEY)); if(t&&t.primary&&t.bg) applyThemeColors(t.primary,t.bg); }catch(e){} }
function openThemeModal(){ document.getElementById('themeModal').classList.add('show'); }
function previewTheme(){ applyThemeColors(document.getElementById('primaryColorPicker').value, document.getElementById('bgColorPicker').value); }
function saveTheme(){ const p=document.getElementById('primaryColorPicker').value, b=document.getElementById('bgColorPicker').value; lsSet(THEME_KEY, JSON.stringify({primary:p,bg:b})); closeModal('themeModal'); showToast('外觀已儲存'); }
function resetTheme(){ try{localStorage.removeItem(THEME_KEY);}catch(e){} applyThemeColors('#1e40af','#f1f5f9'); showToast('已恢復預設'); }

loadTheme();
init();
</script>
